name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/HallownestWayfinder.Tests/HallownestWayfinder.Tests.csproj

      - name: Set up Hollow Knight references
        id: hk-refs
        uses: ./.github/actions/setup-hk-refs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "Tag $env:GITHUB_REF_NAME is not a supported semantic version."
          }
          "value=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Run tests
        run: dotnet test tests/HallownestWayfinder.Tests/HallownestWayfinder.Tests.csproj -c Release --no-restore -warnaserror '-p:HollowKnightRefs=${{ steps.hk-refs.outputs.refs-path }}'

      - name: Build release artifacts
        run: dotnet build HallownestWayfinder.csproj -c Release --no-restore -warnaserror -p:VersionPrefix=${{ steps.version.outputs.value }} '-p:HollowKnightRefs=${{ steps.hk-refs.outputs.refs-path }}'

      - name: Prepare artifacts
        shell: pwsh
        run: |
          Copy-Item bin/Publish/Publish.zip bin/Publish/HallownestWayfinder.zip

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            bin/Publish/HallownestWayfinder.dll `
            bin/Publish/HallownestWayfinder.zip `
            --generate-notes `
            --title "Hallownest Wayfinder $env:GITHUB_REF_NAME"
